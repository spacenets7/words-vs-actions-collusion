name: Review verification

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity-and-tests:
    name: Artifact integrity and 23 offline tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pilot/requirements-verified.txt
            pilot/requirements-report.txt
      - name: Install pinned CPU dependencies
        run: python -m pip install -r pilot/requirements-verified.txt -r pilot/requirements-report.txt
      - name: Verify the review artifacts and original freeze
        run: python scripts/verify_review.py
      - name: Fetch the pinned upstream game for equivalence tests
        run: |
          git clone https://github.com/Jerick-1380/LLM-Trust-Breaking pilot/repos/LLM-Trust-Breaking
          git -C pilot/repos/LLM-Trust-Breaking checkout fd11aca351e52c65c929e1a7d46d9f087f237adf
      - name: Run component and delivery tests without model calls
        run: python -m unittest discover -s pilot/tests -v
  exact-replay:
    name: Exact saved-metrics replay with 5000 bootstrap draws
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pilot/requirements-review.txt
      - name: Install pinned replay dependencies
        run: python -m pip install -r pilot/requirements-review.txt
      - name: Replay the public review archive without inference or API keys
        run: python scripts/replay_results.py
